name: App Store preparation and signed export

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Inspect readiness or export a signed IPA (no automatic upload/release)'
        type: choice
        options: [inspect, signed-export]
        default: inspect

permissions:
  contents: read

concurrency:
  group: app-store-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Read fixed source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify publication and distribution safety
        run: |
          python tests/release.test.py
          python tests/store_signing.test.py
          python tests/privacy_audit.test.py
          python scripts/security_check.py
          bash -n scripts/build_ios_store.sh
      - name: Report outstanding publication requirements
        id: readiness
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          result=subprocess.run(['python','scripts/check_store_release.py','--report','ios-artifacts/store-readiness.json'])
          report=json.loads(pathlib.Path('ios-artifacts/store-readiness.json').read_text())
          if result.returncode not in [0,1] or (result.returncode==0) != report['ready']:
              raise SystemExit('Publication inspection failed unexpectedly')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('ready='+str(report['ready']).lower()+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## App Store preparation\n\n')
              summary.write('Ready for signed export.\n' if report['ready'] else 'App Store publication is pending. Signing was not started.\n')
              for item in report['blockers']: summary.write('- '+item+'\n')
              summary.write('\nThis inspection does not submit or publish an app.\n')
          PY
      - name: Save non-secret readiness report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LiveTalk-App-Store-readiness
          path: ios-artifacts/store-readiness.json
          retention-days: 7
          if-no-files-found: error

  signed-export:
    needs: readiness
    if: inputs.operation == 'signed-export' && needs.readiness.outputs.ready == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 40
    environment: app-store-signing
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Read the same source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Prepare Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify source and shared behavior before signing
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npx playwright install chromium
          npm test
          python scripts/verify_source.py
          python scripts/check_store_release.py
          python scripts/check_build_sdk.py
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Create Apple-signed archive and export
        env:
          LIVETALK_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          LIVETALK_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          LIVETALK_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          LIVETALK_PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
        run: bash scripts/build_ios_store.sh
      - name: Save distributable app only
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: LiveTalk-App-Store-signed
          path: |
            ios/build/store/export/LiveTalkMobile.ipa
            ios/build/store/export/LiveTalkMobile.ipa.sha256
            ios/build/store/export/privacy-package-audit.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: State the remaining upload step
        run: |
          printf '%s\n' '## Signed IPA exported' 'No App Store Connect upload, App Review submission, automatic release or billing activation was performed.' >> "$GITHUB_STEP_SUMMARY"
