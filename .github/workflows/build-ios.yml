name: Build iOS IPA for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'native/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build-ios.yml'
      - 'package*.json'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      GITHUB_TOKEN: ${{ github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Read app sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          npx playwright install chromium
      - name: Check shared logic and IPA packaging
        run: |
          npm test
          python tests/ipa.test.py
          python tests/native_packaging.test.py
          python tests/release.test.py
          python tests/store_signing.test.py
          python scripts/security_check.py
          python scripts/verify_source.py
      - name: Prepare XcodeGen
        run: |
          xcodebuild -version
          python scripts/check_build_sdk.py
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen --version
          swiftc ios/LiveTalk/WaitingFeedbackPolicy.swift tests/feedback/main.swift -o "$RUNNER_TEMP/livetalk-feedback-test"
          "$RUNNER_TEMP/livetalk-feedback-test"
          swiftc ios/LiveTalk/CommercePolicy.swift tests/commerce/main.swift -o "$RUNNER_TEMP/livetalk-commerce-test"
          "$RUNNER_TEMP/livetalk-commerce-test"
          swiftc ios/LiveTalk/ChatGPTProtocol.swift ios/LiveTalk/ConversationOptions.swift ios/LiveTalk/VoiceChunkBuffer.swift tests/options/main.swift -o "$RUNNER_TEMP/livetalk-options-test"
          "$RUNNER_TEMP/livetalk-options-test"
          swiftc ios/LiveTalk/IncomingText.swift tests/incoming/main.swift -o "$RUNNER_TEMP/livetalk-intake-test"
          "$RUNNER_TEMP/livetalk-intake-test"
          swiftc ios/LiveTalk/SpeechTurnDetector.swift tests/turns/main.swift -o "$RUNNER_TEMP/livetalk-turn-test"
          "$RUNNER_TEMP/livetalk-turn-test"
          swiftc ios/LiveTalk/ChatGPTProtocol.swift ios/LiveTalk/OpenAIIdentity.swift tests/auth/main.swift -o "$RUNNER_TEMP/livetalk-auth-test"
          "$RUNNER_TEMP/livetalk-auth-test"
          swiftc ios/LiveTalk/ChatGPTProtocol.swift ios/LiveTalk/OAuthLoopback.swift tests/loopback/main.swift -o "$RUNNER_TEMP/livetalk-loopback-test"
          "$RUNNER_TEMP/livetalk-loopback-test"
      - name: Compile iPhone app and create unsigned IPA
        run: bash scripts/build_ios_cloud.sh
      - name: Save IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTalk-iOS-unsigned
          path: |
            ios/build/cloud/VOICEVOX_LiveTalk_iOS_UNSIGNED.ipa
            ios/build/cloud/VOICEVOX_LiveTalk_iOS_UNSIGNED.ipa.sha256
            ios/build/cloud/ipa-report.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTalk-iOS-build-log
          path: |
            ios/build/cloud/build.log
            ios/build/cloud/build.xcresult
            vendor/download-manifest.json
            vendor/ios/bundle-identifier-adjustments.json
            ios/build/storekit/test.log
            ios/build/storekit/Commerce.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify native purchases with Apple StoreKit Testing
        run: bash scripts/test_storekit.sh
      - name: Save purchase test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LiveTalk-StoreKit-tests
          path: |
            ios/build/storekit/test.log
            ios/build/storekit/Commerce.xcresult
          if-no-files-found: ignore
          retention-days: 7
      - name: State installation requirements
        run: |
          printf '%s\n' '## iPhone app compiled' 'The IPA is unsigned. Sign it for your device before installation. No Apple Account credentials were used in this workflow.' >> "$GITHUB_STEP_SUMMARY"
