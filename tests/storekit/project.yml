name: LiveTalkCommerceTests
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  CommerceHost:
    type: application
    platform: iOS
    sources:
      - HostApp.swift
      - ../../ios/LiveTalk/CommercePolicy.swift
      - ../../ios/LiveTalk/AdRemovalStore.swift
      - ../../ios/LiveTalk/AudioPlaybackDelegate.swift
      - ../../ios/LiveTalk/LoginDismissDelegate.swift
      - path: AdRemoval.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.livetalk.mobile
        ENABLE_TESTABILITY: YES
    dependencies:
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: SafariServices.framework
  CommerceIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CommerceIntegrationTests.swift, DelegateIntegrationTests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.livetalk.mobile.commerce-tests
    dependencies:
      - target: CommerceHost
      - sdk: StoreKitTest.framework
schemes:
  CommerceHost:
    build:
      targets:
        CommerceHost: all
    test:
      gatherCoverageData: false
      targets:
        - name: CommerceIntegrationTests
          parallelizable: false
